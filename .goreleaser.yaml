# How a tag becomes a release and a Homebrew cask: the workflow in
# .github/workflows/release.yml runs `goreleaser release` on every v* tag.
# `goreleaser release --snapshot --clean` tries it locally, into dist/.
version: 2
project_name: dehv

before:
  hooks:
    - go mod tidy
    - go test ./...
    # The zsh completion, generated by the command itself, goes in the archive.
    - sh -c 'mkdir -p completions && go run ./cmd/dehv completion zsh > completions/_dehv'

builds:
  - main: ./cmd/dehv
    binary: dehv
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, CHANGELOG.md, completions/*]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  # The notes are CHANGELOG.md's section for the version.
  footer: "Install: `brew install de-hv/tap/dehv` · upgrade: `brew upgrade dehv`"

homebrew_casks:
  - name: dehv
    repository:
      owner: de-hv
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/de-hv/dehv
    description: My own desktop toolkit, a CLI and a terminal hub
    commit_msg_template: "dehv {{ .Tag }}"
    binaries: [dehv]
    completions:
      zsh: completions/_dehv
    hooks:
      post:
        # The binary is not notarized: without this, macOS refuses to run it
        # the first time. Homebrew's install steps are a DSL of their own, not
        # Ruby: paths go as Homebrew templates, {{staged_path}}, written here
        # through GoReleaser's own template so it leaves them alone.
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/dehv"], must_succeed: false
